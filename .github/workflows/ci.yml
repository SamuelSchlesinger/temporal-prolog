name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cabal update
      - run: cabal build all --enable-tests
      - run: cabal test all
      - run: cabal haddock all
      - run: cabal check
      - run: cabal sdist
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - run: cargo test --manifest-path rust/Cargo.toml --doc
      - run: cargo doc --manifest-path rust/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --manifest-path rust/Cargo.toml
      - run: cargo test --manifest-path rust/target/package/temporal-prolog-0.1.0/Cargo.toml --all-targets --locked
      - run: sh conformance/run.sh
