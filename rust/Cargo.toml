[package]
name = "temporal-prolog"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Independent Rust implementation of Sakuragawa Temporal Prolog"
repository = "https://github.com/SamuelSchlesinger/temporal-prolog"
homepage = "https://github.com/SamuelSchlesinger/temporal-prolog"
documentation = "https://docs.rs/temporal-prolog"
readme = "README.md"
keywords = ["logic-programming", "prolog", "temporal-logic"]
categories = ["compilers", "science"]
exclude = [
    # These repository-level integration tests intentionally consume the
    # shared corpus outside this standalone crate. Self-contained language,
    # operator, oracle, and unit tests remain in the published package.
    "tests/conformance.rs",
    "tests/model_checker.rs",
]

[lib]
name = "temporal_prolog"
path = "src/lib.rs"

[[bin]]
name = "temporal-prolog-rs"
path = "src/main.rs"

[[bin]]
name = "temporal-prolog-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "temporal-prolog-check-rs"
path = "src/bin/check.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
